name: Build

on:
  push:
    branches:
      - base44-migration-20260910
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - run: npm run build

      - name: Install Consult standalone dependencies
        run: npm install --prefix consult-standalone --no-audit --no-fund
      - name: Build Consult standalone
        run: npm run build --prefix consult-standalone
